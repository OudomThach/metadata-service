[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "BLE"]
ignore = ["B008", "SIM105", "BLE001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["BLE001"]

[tool.mypy]
python_version = "3.10"
strict = true
exclude = ["alembic"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
